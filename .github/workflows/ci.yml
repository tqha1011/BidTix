name: CI

# Runs the whole test suite (Testcontainers: needs Docker, which ubuntu-latest has) on every pull request into main
# and on every push to main. The slow benchmarks are tagged "benchmark" and skipped by the default Maven settings.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels the older run; a run on main is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # The app (and so every Spring test context) will not start without the JWT signing keys; keys/ is git-ignored.
      - name: Generate JWT keys
        run: make keys

      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Keep the test reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
