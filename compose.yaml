services:
  database:
    image: 'postgres:latest'
    container_name: 'bidtix-db'
    restart: unless-stopped
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB:-mydb}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mypassword}'
      - 'POSTGRES_USER=${POSTGRES_USER:-myuser}'
    volumes:
      - 'db-data:/var/lib/postgresql/data'
    networks:
      - bidtix-backend
    ports:
      - '5432:5432'

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  cache:
    image: 'redis:8.6.1-alpine'
    container_name: 'bidtix-redis'
    ports:
      - '6379:6379'
    volumes:
      - 'redis-data:/data'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-secret}
      REDIS_URL: redis://:${REDIS_PASSWORD}@localhost:6379

    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-secret}"]

    networks:
      - bidtix-backend

    healthcheck:
      test: [ 'CMD-SHELL', 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli --raw ping | grep -qx PONG' ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  bidtix-backend:
    driver: bridge

volumes:
  db-data:
  redis-data: