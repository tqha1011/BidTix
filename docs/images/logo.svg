<svg xmlns="http://www.w3.org/2000/svg" width="610" height="240" viewBox="0 0 610 240" role="img" aria-labelledby="t d">
  <title id="t">BidTix</title>
  <desc id="d">A ticket with a seat map, one seat taken, and an auction gavel coming down on it, next to the word BidTix.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="ticket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- badge background -->
  <rect x="2" y="2" width="606" height="236" rx="32" fill="url(#bg)" stroke="#334155" stroke-width="2"/>

  <!-- booking: a ticket carrying a seat map, one seat taken -->
  <path fill="url(#ticket)"
        d="M56 84H154A10 10 0 0 0 174 84H196A16 16 0 0 1 212 100V172A16 16 0 0 1 196 188H174A10 10 0 0 0 154 188H56A16 16 0 0 1 40 172V100A16 16 0 0 1 56 84Z"/>
  <line x1="164" y1="100" x2="164" y2="172" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2.5" stroke-dasharray="4 6" stroke-linecap="round"/>
  <g fill="#ffffff" fill-opacity="0.38">
    <rect x="58" y="104" width="17" height="17" rx="5"/><rect x="82" y="104" width="17" height="17" rx="5"/><rect x="106" y="104" width="17" height="17" rx="5"/><rect x="130" y="104" width="17" height="17" rx="5"/>
    <rect x="58" y="128" width="17" height="17" rx="5"/>                                               <rect x="106" y="128" width="17" height="17" rx="5"/><rect x="130" y="128" width="17" height="17" rx="5"/>
    <rect x="58" y="152" width="17" height="17" rx="5"/><rect x="82" y="152" width="17" height="17" rx="5"/><rect x="106" y="152" width="17" height="17" rx="5"/><rect x="130" y="152" width="17" height="17" rx="5"/>
  </g>
  <rect x="82" y="128" width="17" height="17" rx="5" fill="#ffffff"/>

  <!-- auction: the gavel coming down on the ticket -->
  <g transform="translate(205 76) rotate(-45)" fill="url(#gold)" stroke="#14163a" stroke-width="5" stroke-linejoin="round" paint-order="stroke">
    <rect x="-7" y="12" width="14" height="74" rx="7"/>
    <rect x="-30" y="-17" width="60" height="34" rx="3"/>
    <rect x="-43" y="-22" width="15" height="44" rx="6"/>
    <rect x="28" y="-22" width="15" height="44" rx="6"/>
  </g>
  <g stroke="#fbbf24" stroke-width="5" stroke-linecap="round">
    <path d="M144 68L131 61"/>
    <path d="M155 55L149 41"/>
  </g>

  <!-- wordmark -->
  <text x="284" y="138" font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="82" font-weight="800" letter-spacing="-2" fill="#f8fafc">Bid<tspan fill="url(#gold)">Tix</tspan></text>
  <text x="288" y="176" font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="500" letter-spacing="0.4" fill="#94a3b8">No overselling. No lost bids.</text>
</svg>
