# The load balancer in front of the application instances (compose.scale.yaml). For the load test only: no TLS.
worker_processes 2;
worker_rlimit_nofile 40000;

events {
    worker_connections 20000;
}

http {
    # one line per request would measure the log, not the application
    access_log off;

    upstream bidtix {
        # Docker's DNS answers with the address of every instance; nginx takes them all when it starts and gives each
        # request to the next one (round robin).
        server app:8080;
        # connections to the instances are kept and reused, like a client talking to one instance directly
        keepalive 256;
    }

    server {
        listen 8080 backlog=8192;

        location / {
            proxy_pass http://bidtix;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            # overwritten, never appended to: a client must not choose the address the rate limiter sees
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
