spring:
  application:
    name: bidtix-backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          jws-algorithms:
            - RS256
  data:
    redis:
      host: localhost
      port: 6379
      # Spring placeholder default is "${NAME:default}" (one colon); "${NAME:-default}" is bash and would give "-secret".
      password: ${REDIS_PASSWORD:secret}
  cache:
    type: redis
    redis:
      time-to-live: 10s
      use-key-prefix: true
      key-prefix: "bidtix-backend:"   # quoted: a bare value ending in ":" is a YAML syntax error
      cache-null-values: false
  flyway:
    enabled: true
    locations: classpath:db/migration

bidtix:
  # The @Scheduled jobs (auction activation and closing, offer expiry, unpaid-order cancellation) run unless this is false.
  # Only a test that must not race with a background job turns it off.
  scheduling:
    enabled: true
  jwt:
    # PEM files: private key = PKCS#8 ("BEGIN PRIVATE KEY"), public key = X.509 ("BEGIN PUBLIC KEY").
    # Generate dev keys into ./keys (git-ignored); in real deployments override with env vars.
    public-key: ${JWT_PUBLIC_KEY:file:./keys/public.pem}
    private-key: ${JWT_PRIVATE_KEY:file:./keys/private.pem}
  auth:
    refresh-token-ttl: 7d
    refresh-cookie:
      # "Secure" cookies are only sent over https. For plain-http local testing set
      # BIDTIX_AUTH_REFRESHCOOKIE_SECURE=false; keep true everywhere else.
      secure: true

  # VNPAY (see payment/infrastructure). The merchant code and the secret come from the merchant account: set them with
  # environment variables and never commit them. pay-url is the sandbox; the production URL is the only change to go live.
  payment:
    # An order with a payment still waiting for the provider's callback is kept this long after its deadline before its
    # stock is released (booking) or the offer passes on (auction). Customers get no extra time to pay. 0 turns it off.
    confirmation-grace: 10m
    vnpay:
      tmn-code: ${VNP_TMNCODE:}
      hash-secret: ${VNP_HASH_SECRET:}
      pay-url: ${VNP_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      return-url: ${VNP_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay/return}
      ipn-url: ${VNP_IPN_URL:http://localhost:8080/api/v1/payments/vnpay/ipn}
      refund-url: ${VNP_REFUND_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      version: 2.1.0
      command-pay: pay
      command-refund: refund
      command-query: querydr

  # Idempotency-Key (see common/idempotency): a retried POST with the same key and body runs once and then replays the
  # stored response. `paths` are the POST routes that REQUIRE the header. Keys are kept for `ttl`; a key left
  # PROCESSING for longer than `processing-timeout` (the server died mid-request) can be used again.
  idempotency:
    enabled: true
    ttl: 24h
    processing-timeout: 2m
    paths:
      - /api/v1/auctions/*/bids
      - /api/v1/orders
      - /api/v1/orders/*/payments

  # Rate limit (see config/ratelimit). A policy is one of two algorithms, chosen with `algorithm`:
  #   fixed-window (default): at most `limit` requests per `window`, counted from the first request.
  #   token-bucket: a bucket of `capacity` tokens, one per request, `refill-tokens` added every `refill-every`
  #                 (never above the capacity), so `capacity` is the largest burst and the refill is the steady rate.
  # Counters live in Redis, so every instance shares them. `fail-open` says what happens when Redis cannot be
  # reached: true lets the request through, false rejects it (503). Keep it false where a limit protects
  # against guessing (login, register).
  rate-limit:
    enabled: true
    policies:
      auth-login:    { limit: 5, window: 1m, fail-open: false }       # per IP
      auth-register: { limit: 3, window: 1m, fail-open: false }       # per IP
      # per logged-in user, every other API: a burst of 15, then 3 more requests every 10 s (18 a minute)
      default-user:  { algorithm: token-bucket, capacity: 15, refill-tokens: 3, refill-every: 10s, fail-open: true }
      # VNPAY's IPN, per IP: all of VNPAY's calls come from a few addresses, so the limit is wide. Fail-open, because the
      # signature is what protects the route and a payment must still be confirmed while Redis is down.
      vnpay-ipn:     { algorithm: token-bucket, capacity: 100, refill-tokens: 20, refill-every: 1s, fail-open: true }
