spring:
  application:
    name: bidtix-backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          jws-algorithms:
            - RS256
  flyway:
    enabled: true
    locations: classpath:db/migration
